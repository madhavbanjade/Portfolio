<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Madhav Banjade — CV</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111;
      overflow: hidden;
    }

    /* ── TOOLBAR ── */
    .toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 52px;
      background: #0a0a0a;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 10;
    }

    .toolbar-back {
      font-size: 13px;
      color: #a1a1a6;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
      text-decoration: none;
    }
    .toolbar-back:hover { color: #f5f5f7; }

    .toolbar-label {
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #515154;
    }

    .toolbar-download {
      font-size: 13px;
      font-weight: 500;
      color: #fff;
      background: #05880e;
      border: none;
      padding: 8px 18px;
      border-radius: 980px;
      cursor: pointer;
      font-family: inherit;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .toolbar-download:hover { background: #06a810; }

    /* ── PDF EMBED ── */
    .pdf-wrap {
      position: fixed;
      inset: 52px 0 0 0;
    }

    embed {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Fallback message if browser can't display PDF */
    .pdf-fallback {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
      color: #a1a1a6;
      font-size: 15px;
      text-align: center;
      padding: 24px;
    }

    .pdf-fallback a {
      color: #05880e;
      text-decoration: none;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      .toolbar       { padding: 0 16px; }
      .toolbar-label { display: none; }
    }
  </style>
</head>
<body>

<!-- TOOLBAR -->
<div class="toolbar">
  <button class="toolbar-back"
    onclick="(window.parent !== window && window.parent.showPortfolio) ? window.parent.showPortfolio() : history.back()">
    ← Portfolio
  </button>
  <span class="toolbar-label">Curriculum Vitae</span>
  <a class="toolbar-download" href="file/cv.pdf" download="Madhav_Banjade_CV.pdf">
    ↓ Download PDF
  </a>
</div>

<!-- PDF VIEWER -->
<div class="pdf-wrap">
  <embed
    src="file/cv.pdf"
    type="application/pdf"
    onerror="document.querySelector('.pdf-fallback').style.display='flex'; this.style.display='none';"
  />
  <div class="pdf-fallback">
    <p>Your browser can't display PDFs inline.</p>
    <a href="file/cv.pdf" download="Madhav_Banjade_CV.pdf">Click here to download your CV</a>
  </div>
</div>

</body>
</html>
